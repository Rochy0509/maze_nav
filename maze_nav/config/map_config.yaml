# Map configuration
map:
  image_path: "/home/tron/maze_maps/maze.png"
  real_width_m: 3.658
  real_height_m: 3.658
  origin_x: 0.0
  origin_y: 0.0
  robot_radius_m: 0.15

# Planning parameters
planner:
  max_iterations: 1500
  step_size_m: 0.08
  goal_tolerance_m: 0.12
  rewire_radius_m: 0.4
  goal_bias: 0.15

# Path following
controller:
  lookahead_distance_m: 0.25
  max_linear_speed_ms: 0.4
  max_angular_speed_rads: 1.5
  path_completion_tolerance_m: 0.15
